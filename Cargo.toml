[package]
name = "xdu"
version = "0.5.1"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
rayon = "1.10"
parquet = { version = "59", features = ["arrow"] }
arrow = { version = "59", features = ["chrono-tz"] }
jwalk = "0.9"
anyhow = "1"
indicatif = "0.18"
console = "0.16"
# `bundled` compiles DuckDB but does not link the Parquet reader; `parquet` does. Without it
# the readers autoinstall a 12 MB extension on first use and cannot query an air-gapped host.
duckdb = { version = "1", features = ["bundled", "parquet"] }
infer = "0.22"
# Runtime NSS (getpwnam/getgrnam) for --owner/--group resolution; also a dev-dep below.
libc = "0.2"
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
tempfile = "3"
libc = "0.2"

[[bin]]
name = "xdu"
path = "src/bin/xdu.rs"

[[bin]]
name = "xdu-find"
path = "src/bin/xdu-find.rs"

[[bin]]
name = "xdu-view"
path = "src/bin/xdu-view.rs"

[[bin]]
name = "xdu-rm"
path = "src/bin/xdu-rm.rs"

[[bin]]
name = "gen-completions"
path = "src/bin/gen-completions.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
