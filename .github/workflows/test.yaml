name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict the default GITHUB_TOKEN: nothing here needs more than repository read.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR) to save CI minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Format + lint gates run once (host-independent): fmt is deterministic and clippy denies
  # all warnings, so a single Linux runner is enough.
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve toolchain from rust-toolchain.toml
        id: rust
        run: |
          echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # SHA-pinned action; toolchain version comes from rust-toolchain.toml (single source)
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Build + test on every supported host (Linux + macOS); fail-fast off so one host's
  # failure still reports the other. RUSTFLAGS -D warnings turns any build warning into an
  # error here too (clippy's -D warnings does not cover a plain `cargo build`).
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve toolchain from rust-toolchain.toml
        id: rust
        run: |
          echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # SHA-pinned action; toolchain version comes from rust-toolchain.toml (single source)
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build
        run: cargo build --locked --all-features

      - name: Test
        run: cargo test --locked --all-features

  # Mirrors HyperShell's packaging-metadata job: regenerate the shipped artifacts and fail
  # if any are missing. Because man pages come from doc/*.scd and completions come from
  # src/cli.rs, this catches CLI <-> doc/scd drift at PR time (a new/renamed binary or a
  # dropped man page shows up as a missing artifact).
  packaging:
    name: Packaging (man + completions generate)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve toolchain from rust-toolchain.toml
        id: rust
        run: |
          echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # SHA-pinned action; toolchain version comes from rust-toolchain.toml (single source)
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install scdoc + mandoc
        # mandoc renders the generated .1 back to plain text so the assertion step below can read
        # what the page PUBLISHES, not just that it compiled; bsdextrautils supplies `col`, which
        # strips mandoc's backspace-overstrike bytes (not in the base image on ubuntu-24.04).
        run: sudo apt-get update && sudo apt-get install -y scdoc mandoc bsdextrautils

      - name: Render man pages (doc/*.scd -> share/man/man1/*.1)
        run: |
          mkdir -p share/man/man1
          for scd in doc/*.scd; do
            name=$(basename "$scd" .1.scd)
            scdoc < "$scd" > "share/man/man1/${name}.1"
          done

      # scdoc exiting 0 is necessary but not sufficient — the same rule the build gate already
      # states for code. scdoc markup fails two ways: a nesting error is loud, but a mis-escaped
      # literal is SILENT. doc/xdu.1.scd once shipped `_OUTDIR_/*/*.parquet`, which renders at
      # exit 0 and publishes `OUTDIR//.parquet` — a wrong glob handed to an operator, past a green
      # gate. So assert the published TEXT of the artifact this job just produced. The escaping
      # rules themselves are single-sourced in AGENTS.md "Commands"; they are not restated here.
      #
      # The verdict must depend on the page's CONTENT, never on its layout, so whitespace is
      # stripped from both the published text and the literal before matching. Collapsing newlines
      # to spaces is not enough: mandoc fills to whatever width it likes and may break a line
      # INSIDE a token — a bare roff `-` is a legal break opportunity, so `OUTDIR/.xdu-complete`
      # can publish as `OUTDIR/.xdu-` + newline + `complete` — and `col -b` indents continuation
      # lines with a literal TAB, which squeezing spaces never touches.
      #
      # Stripping whitespace is lossy: it can fuse two adjacent tokens into a string that never
      # appeared on the page (`e.g. partial` becomes `e.g.partial`, which contains `.partial`).
      # For a presence check that can only cause a false green; for an exact-count check it causes
      # a false red, so a counted needle must be specific enough that fusion cannot synthesize it
      # — hence `.partial suffix` rather than `.partial`.
      #
      # Counts exist because a presence check on a literal that occurs twice fires only when EVERY
      # occurrence is corrupted. `Nx:LITERAL` asserts exactly N, so corrupting either one is caught.
      #
      # Each page is rendered once and that render is judged before any literal is, so a page that
      # failed to render or rendered to nothing is reported as such instead of as a pile of corrupt
      # literals. mandoc exits 0 on an empty file and on a garbage file, so the length guard is not
      # redundant with the exit status.
      #
      # `|| got=0` is load-bearing: grep exits 1 on zero matches, so under a shell with `pipefail`
      # set -e would kill the step before the diagnostic is printed — in exactly the zero-count
      # case the count was added to catch.
      - name: Assert critical literals survive into the published man-page text
        run: |
          set -eu
          published() {
            raw=$(mandoc -Tutf8 "$1") || return 1
            printf '%s\n' "$raw" | col -b | tr -d '[:space:]'
          }
          fail=0
          check() {
            page="$1"; shift
            if ! text=$(published "$page"); then
              echo "RENDER FAILED: mandoc could not render $page" >&2
              fail=1
              return
            fi
            if [ "${#text}" -lt 200 ]; then
              echo "RENDER EMPTY: $page produced only ${#text} characters — nothing to assert" >&2
              fail=1
              return
            fi
            for spec in "$@"; do
              case "$spec" in
                [0-9]x:*) want="${spec%%x:*}"; lit="${spec#*x:}" ;;
                *)        want=""; lit="$spec" ;;
              esac
              needle=$(printf '%s' "$lit" | tr -d '[:space:]')
              if [ -n "$want" ]; then
                got=$(printf '%s' "$text" | grep -oF -- "$needle" | wc -l | tr -d ' ') || got=0
                if [ "$got" -ne "$want" ]; then
                  echo "CORRUPT RENDER: $page has $got occurrence(s) of the literal '$lit', expected $want" >&2
                  fail=1
                fi
              elif ! printf '%s' "$text" | grep -qF -- "$needle"; then
                echo "CORRUPT RENDER: $page is missing the literal: $lit" >&2
                fail=1
              fi
            done
          }
          check share/man/man1/xdu.1 \
            'OUTDIR/<partition>/<chunk>.parquet' \
            'OUTDIR/*/*.parquet' \
            'OUTDIR/.xdu-complete' \
            '__root__' \
            '2x:.partial suffix' \
            'st_blocks * 512'
          check share/man/man1/xdu-find.1 'XDU_INDEX'
          check share/man/man1/xdu-view.1 'XDU_INDEX'
          check share/man/man1/xdu-rm.1   'XDU_INDEX' 'XDU_JOBS'
          # A line starting with `.` or `'` is a roff control request: scdoc drops the period
          # silently, and the intuitive `\.` escape destroys the rest of the line. Rewrap instead.
          if grep -nE "^[[:space:]]*['.]" doc/*.scd; then
            echo "ROFF CONTROL LINE: a doc/*.scd line begins with . or ' — rewrap it instead" >&2
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "OK: every asserted literal survived into the published man-page text"

      - name: Generate shell completions
        run: |
          cargo build --release --locked --bin gen-completions
          mkdir -p share/bash-completion/completions share/zsh/site-functions
          ./target/release/gen-completions share/bash-completion/completions share/zsh/site-functions

      - name: Assert all man pages + completions were produced
        run: |
          set -eu
          missing=""
          for f in \
            share/man/man1/xdu.1 \
            share/man/man1/xdu-find.1 \
            share/man/man1/xdu-view.1 \
            share/man/man1/xdu-rm.1 \
            share/bash-completion/completions/xdu.bash \
            share/bash-completion/completions/xdu-find.bash \
            share/bash-completion/completions/xdu-view.bash \
            share/bash-completion/completions/xdu-rm.bash \
            share/zsh/site-functions/_xdu \
            share/zsh/site-functions/_xdu-find \
            share/zsh/site-functions/_xdu-view \
            share/zsh/site-functions/_xdu-rm; do
            if [ ! -s "$f" ]; then
              missing="${missing} ${f}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "MISSING generated packaging artifacts:${missing}" >&2
            exit 1
          fi
          echo "OK: all four man pages and all bash+zsh completions present"
